name: docker

on:
  push:
    branches: [master, feat/docker-unraid]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        # "dev" is a PEP 735 dependency group, not an extra, so name the tools.
        run: pip install -e . ruff pytest pyyaml
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  publish:
    needs: test
    # Only publish from the fork's own branches and tags, never from PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: seerr-mcp:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          set -euo pipefail
          cfg=$(mktemp -d)
          token=$(openssl rand -hex 24)
          printf '%s' "$token" > "$cfg/token"
          docker run -d --name smoke -p 127.0.0.1:8551:8551 \
            -e SEERR_URL=http://127.0.0.1:5055 -e SEERR_API_KEY=unused \
            -e ISSUER=https://smoke.example.com -e APP_PASSWORD=smoke-pass \
            -v "$cfg:/config" seerr-mcp:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8551/healthz && break; sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8551/healthz)" = ok
          # Unauthenticated MCP calls must be refused by the OAuth front.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8551/mcp)" = 401
          # Authenticated initialize must reach the MCP server through nginx and the auth tier.
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          # The auth tier answers before the Python server is listening, so retry until it is up.
          code=000
          for i in $(seq 1 60); do
            code=$(curl -sS -o init.txt -w '%{http_code}' -X POST http://127.0.0.1:8551/mcp \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' -d "$body" || echo 000)
            [ "$code" = 200 ] && break
            sleep 1
          done
          echo "initialize HTTP $code"
          cat init.txt; echo
          test "$code" = 200
          grep -qi 'seerr' init.txt
          docker exec smoke test -f /config/password-hash

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke 2>&1 | tail -80

      - name: Stop smoke container
        if: always()
        run: docker rm -f smoke || true

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/veilofsecurity/seerr-mcp
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
