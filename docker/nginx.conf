# Front door for the container. Listens on 8551 and hands everything to the
# auth server on loopback. MCP streams over SSE, so buffering stays off.
# Temp paths live in /tmp so the container can run without root-owned dirs.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;

    server {
        listen 8551;
        client_max_body_size 4m;

        location / {
            proxy_pass http://127.0.0.1:8552;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
